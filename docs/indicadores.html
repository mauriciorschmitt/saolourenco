<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicadores e série completa — Represa São Lourenço</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EDF0EF; --panel:#FFFFFF; --ink:#12303A; --muted:#5E747C;
  --line:#D2DBD9; --water:#2A6B8C; --algae:#6E9435; --silt:#A8762F;
  --alert:#A8432A; --band:#C9D6D4;
  --serif:'Spectral',Georgia,serif; --sans:'Archivo','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--ground:#0E1C21; --panel:#132930; --ink:#E4ECEA; --muted:#8EA6AC;
        --line:#26414A; --band:#24414A; --water:#5AA3C4; --algae:#9BC25C;
        --silt:#D2A45C; --alert:#E0795A;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 72px}
a{color:var(--water)}
.num{font-variant-numeric:tabular-nums}

.voltar{font-size:14px;display:inline-block;margin-bottom:22px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,5vw,38px);
   margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:0 0 30px;max-width:70ch}
h2{font-family:var(--serif);font-weight:400;font-size:24px;
   margin:44px 0 6px;padding-top:28px;border-top:1px solid var(--line)}
h2:first-of-type{border-top:none;padding-top:0}
h3{font-family:var(--serif);font-weight:600;font-size:18px;margin:30px 0 4px}
p{max-width:70ch}

/* como ler */
.conceito{display:grid;grid-template-columns:130px 1fr;gap:14px 20px;
          align-items:baseline;margin:18px 0}
@media (max-width:640px){.conceito{grid-template-columns:1fr;gap:4px 0}}
.conceito dt{font-weight:600;font-size:14px}
.conceito dd{margin:0;color:var(--muted);font-size:14.5px;max-width:64ch}
.escala{display:flex;gap:2px;margin:14px 0 6px;max-width:520px}
.escala div{flex:1;height:8px}
.escala-rot{display:flex;justify-content:space-between;max-width:520px;
            font-size:12px;color:var(--muted)}

/* índices */
.indice{margin:32px 0 0;padding-bottom:8px}
.formula{font-family:var(--serif);font-size:17px;background:var(--panel);
         border-left:3px solid var(--water);padding:10px 14px;margin:12px 0;
         display:inline-block}
.bandas{font-size:13px;color:var(--muted);margin:6px 0 0}
.leitura-guia{font-size:14.5px;color:var(--muted);margin:10px 0 0}
.mini{background:var(--panel);border:1px solid var(--line);padding:12px;
      margin-top:14px}
.mini svg{width:100%;height:auto;display:block}

/* filtros e tabela */
.filtros{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
         margin:20px 0 16px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-size:12px;color:var(--muted)}
select,input,button{font-family:inherit;font-size:14px;padding:7px 10px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:2px}
button{cursor:pointer;border-color:var(--water);color:var(--water);
       font-weight:500}
button:hover{background:var(--water);color:var(--panel)}
button:focus-visible,select:focus-visible,input:focus-visible{
  outline:2px solid var(--water);outline-offset:1px}
.contagem{font-size:13px;color:var(--muted);margin:0 0 10px}
.rolagem{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);
   padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
   position:sticky;top:0;background:var(--panel);cursor:pointer}
th:hover{color:var(--ink)}
th.asc::after{content:' ▲';font-size:9px}
th.desc::after{content:' ▼';font-size:9px}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n{text-align:right}
tbody tr:hover td{background:rgba(42,107,140,.05)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:2px}
.t-ALTA{background:rgba(110,148,53,.16);color:var(--algae)}
.t-MEDIA{background:rgba(168,118,47,.16);color:var(--silt)}
.t-BAIXA{background:rgba(168,67,42,.14);color:var(--alert)}
.s-ALERTA{color:var(--alert);font-weight:600}
.s-ATENCAO{color:var(--silt)}
.mais{margin-top:14px}
.erro{border:1px solid var(--alert);color:var(--alert);padding:16px;
      font-size:14px;max-width:70ch}
footer{margin-top:52px;border-top:1px solid var(--line);padding-top:20px;
       font-size:13px;color:var(--muted)}
footer li{margin-bottom:6px;max-width:74ch}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Carregando…</p></div>

<script>
const DADOS='data/';
const SISTEMA_ANTIGO='https://mauriciorschmitt.github.io/saolourencoalert/';

const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:null;};
const fmt=(v,d=3)=>v===null?'—':v.toLocaleString('pt-BR',
  {minimumFractionDigits:d,maximumFractionDigits:d});

// Conteúdo explicativo: o que cada índice mede e como interpretá-lo.
const GUIA={
  ndvi:{nome:'Vegetação — NDVI',
    formula:'NDVI = (B08 − B04) / (B08 + B04)',
    bandas:'B08 infravermelho próximo (842 nm) · B04 vermelho (665 nm)',
    mede:'Presença de vegetação fotossintética. Folhas refletem muito no infravermelho próximo e absorvem no vermelho; a água faz o oposto, absorvendo fortemente o infravermelho.',
    ler:'Sobre água limpa o valor é baixo ou negativo, tipicamente entre −0,2 e 0. Vegetação flutuante cobrindo a lâmina eleva o índice de forma acentuada, podendo passar de 0,6. É esse contraste que torna o NDVI sensível à expansão de macrófitas.',
    cuidado:'Margem exposta por rebaixamento do nível também eleva o NDVI, sem que haja vegetação nova sobre a água. Por isso o NDMI é acompanhado em paralelo.'},
  fai:{nome:'Algas flutuantes — FAI',
    formula:'FAI = B08 − [B04 + (B11 − B04) × 0,187]',
    bandas:'B08 infravermelho próximo · B04 vermelho · B11 infravermelho de ondas curtas (1610 nm)',
    mede:'Desvio do infravermelho próximo em relação a uma linha de base traçada entre o vermelho e o infravermelho de ondas curtas. Vegetação flutuante produz um pico nessa faixa que a linha de base não explica.',
    ler:'Valores próximos de zero indicam superfície de água sem cobertura. Valores positivos crescentes indicam material flutuante. A escala é menor que a do NDVI, então diferenças de poucos centésimos já são relevantes.',
    cuidado:'Por subtrair uma linha de base, o FAI é menos sensível a variação atmosférica que o NDVI — vantagem numa série longa com correção atmosférica imperfeita.'},
  ndci:{nome:'Clorofila relativa — NDCI',
    formula:'NDCI = (B05 − B04) / (B05 + B04)',
    bandas:'B05 red-edge (705 nm) · B04 vermelho (665 nm)',
    mede:'Concentração relativa de clorofila na coluna d\u2019água. A banda red-edge foi escolhida porque a clorofila produz um pico de reflectância característico nessa faixa em águas produtivas.',
    ler:'Aumentos sustentados sugerem crescimento de fitoplâncton, associado a enriquecimento por nutrientes. É o indicador mais direto de eutrofização disponível por satélite.',
    cuidado:'O valor é relativo, não é concentração. Sem amostragem de campo para calibração, não se traduz em microgramas por litro.'},
  ndti:{nome:'Turbidez relativa — NDTI',
    formula:'NDTI = (B04 − B03) / (B04 + B03)',
    bandas:'B04 vermelho · B03 verde (560 nm)',
    mede:'Balanço entre vermelho e verde, que se desloca conforme material particulado em suspensão espalha luz na coluna d\u2019água.',
    ler:'Valores mais altos indicam água mais carregada de sedimento. Picos costumam acompanhar eventos de chuva intensa, por aporte da bacia.',
    cuidado:'Sedimento mineral e matéria orgânica particulada produzem efeito semelhante, e o índice não os distingue.'},
  cdom:{nome:'Matéria orgânica dissolvida — proxy',
    formula:'razão = B03 / B04',
    bandas:'B03 verde · B04 vermelho',
    mede:'Proxy de substâncias orgânicas dissolvidas, que absorvem preferencialmente nos comprimentos de onda curtos e alteram a razão entre verde e vermelho.',
    ler:'Acompanhe a tendência, não o valor absoluto. Quedas sustentadas da razão podem indicar aumento de carga orgânica dissolvida.',
    cuidado:'Este é o indicador mais incerto do conjunto. Em água interior o sinal se confunde com clorofila e sedimento, e por isso ele acompanha sem gerar alerta.'},
  ndwi:{nome:'Água — NDWI',
    formula:'NDWI = (B03 − B08) / (B03 + B08)',
    bandas:'B03 verde · B08 infravermelho próximo',
    mede:'Delimitação de superfície líquida. É o índice usado para contar quantos pixels ainda são água e converter isso em hectares.',
    ler:'Positivo sobre água aberta, negativo sobre vegetação e solo. A área em hectares derivada dele é o melhor indicador disponível de variação do nível do reservatório.',
    cuidado:'Tanto vegetação flutuante quanto margem exposta reduzem o NDWI, o que limita seu uso para distinguir as duas situações.'},
  ndmi:{nome:'Umidade — NDMI',
    formula:'NDMI = (B08 − B11) / (B08 + B11)',
    bandas:'B08 infravermelho próximo · B11 infravermelho de ondas curtas',
    mede:'Conteúdo de umidade da superfície observada. O infravermelho de ondas curtas é absorvido pela água contida em tecidos vegetais e em substratos úmidos.',
    ler:'É o índice de controle. Vegetação aquática mantém o NDMI elevado; substrato exposto e seco o reduz. Um aumento de NDVI acompanhado de NDMI estável ou em alta aponta para vegetação; acompanhado de queda, aponta para exposição de margem.',
    cuidado:'Por ser calculado a partir de banda de 20 m reamostrada, tem resolução efetiva menor que os demais.'},
};

function parseCSV(t){
  const l=t.trim().split(/\r?\n/); if(l.length<2) return [];
  const c=l[0].split(',');
  return l.slice(1).map(x=>{const v=x.split(','),o={};
    c.forEach((k,i)=>o[k]=v[i]===undefined?'':v[i]); return o;});
}
async function tentar(a,t='json'){
  try{const r=await fetch(DADOS+a,{cache:'no-store'});
      if(!r.ok) return null; return t==='json'?r.json():r.text();}
  catch(e){return null;}
}

function serieSVG(linhas, k, W=940, H=170){
  const pts=linhas.map(r=>({t:r.data,v:num(r[k]),c:r.confianca}))
                  .filter(p=>p.v!==null);
  if(pts.length<2) return '<p class="sub">Sem dados suficientes.</p>';
  const ml=46,mr=10,mt=10,mb=22;
  const t0=+new Date(pts[0].t),t1=+new Date(pts[pts.length-1].t);
  const vs=pts.map(p=>p.v); let lo=Math.min(...vs),hi=Math.max(...vs);
  const f=(hi-lo)*.1||.05; lo-=f; hi+=f;
  const X=t=>ml+((+new Date(t)-t0)/(t1-t0||1))*(W-ml-mr);
  const Y=v=>mt+(1-(v-lo)/(hi-lo))*(H-mt-mb);
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const zero=(lo<0&&hi>0)?`<line x1="${ml}" x2="${W-mr}" y1="${Y(0).toFixed(1)}"
    y2="${Y(0).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 3"
    stroke-width="1" opacity=".5"/>`:'';
  const marcas=pts.filter(p=>p.c==='ALTA').map(p=>
    `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="1.7"
      fill="var(--water)" opacity=".8"><title>${p.t} · ${fmt(p.v)}</title></circle>`).join('');
  const anos=[...new Set(pts.map(p=>p.t.slice(0,4)))];
  const tx=anos.map(a=>{const p=pts.find(q=>q.t.slice(0,4)===a);
    return `<text x="${X(p.t).toFixed(1)}" y="${H-6}" text-anchor="middle"
      font-size="10" fill="var(--muted)">${a}</text>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Série de ${k}">
    <line x1="${ml}" x2="${W-mr}" y1="${Y(hi).toFixed(1)}" y2="${Y(hi).toFixed(1)}" stroke="var(--line)"/>
    <line x1="${ml}" x2="${W-mr}" y1="${Y(lo).toFixed(1)}" y2="${Y(lo).toFixed(1)}" stroke="var(--line)"/>
    <text x="${ml-6}" y="${(Y(hi)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(hi,2)}</text>
    <text x="${ml-6}" y="${(Y(lo)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(lo,2)}</text>
    ${zero}<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.1" opacity=".5"/>
    ${marcas}${tx}</svg>`;
}

let LINHAS=[], COLS=[], VISIVEIS=100, ORD={col:'data',dir:-1};

function filtrar(){
  const ano=document.getElementById('f-ano').value;
  const conf=document.getElementById('f-conf').value;
  const sit=document.getElementById('f-sit').value;
  return LINHAS.filter(r=>{
    if(ano!=='todos' && r.data.slice(0,4)!==ano) return false;
    if(conf!=='todas' && r.confianca!==conf) return false;
    if(sit==='alerta' && !COLS.some(c=>c.endsWith('_status')&&r[c]==='ALERTA')) return false;
    if(sit==='confirmado' && !COLS.some(c=>c.endsWith('_confirmado')&&r[c]==='SIM')) return false;
    return true;
  }).sort((a,b)=>{
    const x=a[ORD.col]??'', y=b[ORD.col]??'';
    const nx=parseFloat(x), ny=parseFloat(y);
    const cmp=(Number.isFinite(nx)&&Number.isFinite(ny))?nx-ny:String(x).localeCompare(String(y));
    return cmp*ORD.dir;
  });
}

function tabela(){
  const dados=filtrar();
  const mostra=dados.slice(0,VISIVEIS);
  const idx=Object.keys(GUIA).filter(k=>COLS.includes(k));
  const areas=COLS.filter(c=>c.startsWith('area_'));
  const cols=['data','confianca',...idx,...areas];
  const rot={data:'Data',confianca:'Confiança'};
  idx.forEach(k=>rot[k]=GUIA[k].nome.split(' — ')[0]);
  areas.forEach(c=>rot[c]=c.replace('area_','').replace('_ha','').replace(/_/g,' ')+' (ha)');

  document.getElementById('contagem').textContent =
    `${dados.length} de ${LINHAS.length} passagens` +
    (dados.length>mostra.length?` · exibindo as ${mostra.length} primeiras`:'');

  document.getElementById('tabela').innerHTML = `
    <thead><tr>${cols.map(c=>
      `<th data-c="${c}" class="${ORD.col===c?(ORD.dir>0?'asc':'desc'):''}">${rot[c]||c}</th>`
    ).join('')}</tr></thead>
    <tbody>${mostra.map(r=>`<tr>
      <td class="num">${r.data}</td>
      <td><span class="tag t-${r.confianca}">${(r.confianca||'').toLowerCase()}</span></td>
      ${idx.map(k=>{const st=r[k+'_status'];
        return `<td class="n num ${st?'s-'+st:''}">${fmt(num(r[k]))}</td>`;}).join('')}
      ${areas.map(c=>`<td class="n num">${fmt(num(r[c]),1)}</td>`).join('')}
    </tr>`).join('')}</tbody>`;

  document.querySelectorAll('#tabela th').forEach(th=>{
    th.onclick=()=>{const c=th.dataset.c;
      ORD = ORD.col===c ? {col:c,dir:-ORD.dir} : {col:c,dir:1}; tabela();};
  });
  document.getElementById('mais').style.display =
    dados.length>mostra.length ? 'inline-block' : 'none';
}

function exportar(){
  const dados=filtrar();
  const csv=[COLS.join(',')].concat(
    dados.map(r=>COLS.map(c=>r[c]??'').join(','))).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='represa_sao_lourenco_filtrado.csv'; a.click();
  URL.revokeObjectURL(a.href);
}

(async function(){
  const app=document.getElementById('app');
  const csv=await tentar('represa.csv','texto');
  if(!csv){
    app.innerHTML=`<div class="erro">Não encontrei <code>data/represa.csv</code>.
      Rode o monitoramento na aba Actions antes de abrir esta página.</div>`;
    return;
  }
  LINHAS=parseCSV(csv).filter(r=>r.data);
  COLS=Object.keys(LINHAS[0]||{});
  const anos=[...new Set(LINHAS.map(r=>r.data.slice(0,4)))].sort().reverse();
  const presentes=Object.keys(GUIA).filter(k=>COLS.includes(k));

  app.innerHTML=`
  <a class="voltar" href="./">← Voltar ao painel</a>
  <h1>Indicadores e série completa</h1>
  <p class="sub">O que cada índice mede, como interpretá-lo e a série inteira
    de ${LINHAS.length} passagens, de ${LINHAS[0].data} a
    ${LINHAS[LINHAS.length-1].data}.</p>

  <h2>Como ler os números</h2>
  <dl class="conceito">
    <dt>Índice</dt><dd>Combinação de bandas do satélite que realça uma
      característica da superfície. Todos os usados aqui são adimensionais e
      variam, na prática, entre −1 e 1.</dd>
    <dt>Escore</dt><dd>Quantos desvios-padrão a leitura se afasta da média
      histórica <em>daquele mês</em>. Comparar com o mesmo mês remove a
      sazonalidade: um valor alto em dezembro pode ser normal para dezembro.</dd>
    <dt>Situação</dt><dd>Escore a partir de 1,5 é atenção; a partir de 2,0 é
      alerta. Apenas desvios para cima disparam, porque é o que caracteriza
      crescimento de vegetação ou de biomassa.</dd>
    <dt>Confirmação</dt><dd>Um alerta só é confirmado quando duas passagens
      qualificadas seguidas cruzam o limiar. Pico isolado é assinatura típica
      de nuvem residual, não de alteração real.</dd>
    <dt>Confiança</dt><dd>Fração da represa efetivamente visível na passagem.
      Quanto menor, mais a média foi calculada sobre um pedaço do
      reservatório — e nuvem residual tende a inflar os índices.</dd>
  </dl>
  <div class="escala">
    <div style="background:var(--alert)"></div>
    <div style="background:var(--silt)"></div>
    <div style="background:var(--algae);flex:2"></div>
  </div>
  <div class="escala-rot"><span>baixa · abaixo de 30%</span>
    <span>média · 30 a 70%</span><span>alta · acima de 70%</span></div>

  <h2>Os indicadores</h2>
  <p class="sub" style="margin-bottom:0">Sete índices, cada um sensível a um
    aspecto diferente da superfície da água. Quatro geram alerta; três
    acompanham e ajudam a interpretar os demais.</p>
  ${presentes.map(k=>`
    <div class="indice">
      <h3>${GUIA[k].nome}</h3>
      <div class="formula">${GUIA[k].formula}</div>
      <p class="bandas">${GUIA[k].bandas}</p>
      <p>${GUIA[k].mede}</p>
      <p class="leitura-guia"><strong>Como ler:</strong> ${GUIA[k].ler}</p>
      <p class="leitura-guia"><strong>Cuidado:</strong> ${GUIA[k].cuidado}</p>
      <div class="mini">${serieSVG(LINHAS,k)}</div>
    </div>`).join('')}

  <h2>Série completa</h2>
  <p class="sub" style="margin-bottom:0">Clique num cabeçalho para ordenar.
    Valores em vermelho ou âmbar indicam alerta e atenção naquele índice.</p>
  <div class="filtros">
    <div class="campo"><label for="f-ano">Ano</label>
      <select id="f-ano"><option value="todos">todos</option>
      ${anos.map(a=>`<option>${a}</option>`).join('')}</select></div>
    <div class="campo"><label for="f-conf">Confiança</label>
      <select id="f-conf"><option value="todas">todas</option>
        <option value="ALTA">alta</option><option value="MEDIA">média</option>
        <option value="BAIXA">baixa</option></select></div>
    <div class="campo"><label for="f-sit">Situação</label>
      <select id="f-sit"><option value="todas">todas</option>
        <option value="alerta">com alerta</option>
        <option value="confirmado">alerta confirmado</option></select></div>
    <button id="btn-csv">Baixar seleção em CSV</button>
  </div>
  <p class="contagem" id="contagem"></p>
  <div class="rolagem"><table id="tabela"></table></div>
  <button class="mais" id="mais">Mostrar mais 100</button>

  <footer>
    <p>Para visualizar as imagens dos índices sobre o reservatório, consulte o
      <a href="${SISTEMA_ANTIGO}">sistema de monitoramento de macrófitas</a>,
      que mantém o painel de imagens por data.</p>
    <ul>
      <li>Os índices são relativos e expressos como anomalia frente ao histórico. Sem amostragem de campo, não correspondem a concentrações.</li>
      <li>A correção atmosférica utilizada é destinada a superfícies terrestres e introduz incerteza adicional sobre água.</li>
      <li>O sistema detecta alteração espectral. Não identifica espécie, substância ou origem de lançamento.</li>
      <li>Alertas são triagem e indicam necessidade de verificação independente.</li>
    </ul>
  </footer>`;

  ['f-ano','f-conf','f-sit'].forEach(id=>
    document.getElementById(id).onchange=()=>{VISIVEIS=100;tabela();});
  document.getElementById('btn-csv').onclick=exportar;
  document.getElementById('mais').onclick=()=>{VISIVEIS+=100;tabela();};
  tabela();
})();
</script>
</body>
</html>
