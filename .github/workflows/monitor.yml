name: Monitoramento da água (agendado)

on:
  schedule:
    - cron: "0 9 * * 1,4"   # segunda e quinta, 09:00 UTC (06:00 BRT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitoramento
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Executar monitoramento
        env:
          SH_CLIENT_ID:     ${{ secrets.SH_CLIENT_ID }}
          SH_CLIENT_SECRET: ${{ secrets.SH_CLIENT_SECRET }}
        run: python -m src.monitor
      - name: Publicar séries atualizadas
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || \
            git commit -m "dados: atualiza séries de monitoramento [skip ci]"
          git push
      - name: Notificar falha
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=[ERRO] Monitoramento da água falhou: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              > /dev/null
          fi
